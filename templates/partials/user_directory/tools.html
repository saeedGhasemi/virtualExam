{% comment %}Shared «فهرست اطلاعات» sheet: columns / Excel / print buttons (inside .ud-bar). Needs: columns, rows, dir_key.{% endcomment %}
            <div class="ud-tools">
                <details class="ud-cols" data-dir-cols="{{ dir_key }}">
                    <summary class="ud-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>ستون‌ها</summary>
                    <div class="ud-cols-panel">
                        <p>ستون‌های انتخاب‌شده در صفحه، چاپ و فایل اکسل نمایش داده می‌شوند.</p>
                        <div class="ud-cols-grid">
                            {% for col in columns %}
                                <label><input type="checkbox" value="{{ col.key }}" data-default="{{ col.default|yesno:'1,0' }}"{% if col.default %} checked{% endif %}>{{ col.label }}</label>
                            {% endfor %}
                        </div>
                        <button type="button" class="ud-cols-reset" data-dir-cols-reset>بازگرداندن ستون‌های پیش‌فرض</button>
                    </div>
                </details>
                <a class="ud-btn is-green" href="?{{ request.GET.urlencode }}" data-dir-export data-live-skip{% if not rows %} aria-disabled="true"{% endif %}>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="m9 13 4 5M13 13l-4 5"/></svg>خروجی اکسل
                </a>
                <button type="button" class="ud-btn is-primary" onclick="window.print()">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>چاپ فهرست
                </button>
            </div>
