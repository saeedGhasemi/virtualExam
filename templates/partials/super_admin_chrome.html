{% load static core_extras %}
<style>
    html:has(.super-admin-chrome),body:has(.super-admin-chrome){margin:0!important;padding:0!important}
    body:has(.super-admin-chrome){font-family:"B Yekan",BYekan,"B Yekan+",Vazirmatn,Tahoma,Arial,sans-serif!important}
    .super-admin-chrome{--blue:#315cff;--ink:#071936;--muted:#65728a;--line:#dbe4f1;direction:rtl;color:var(--ink);font-family:"B Yekan",BYekan,"B Yekan+",Vazirmatn,Tahoma,Arial,sans-serif;font-size:15px;height:82px}

    .super-admin-topbar{position:fixed;top:-1px;right:0;left:0;z-index:90;display:grid;grid-template-columns:320px minmax(0,1fr) 320px;align-items:center;gap:1rem;height:83px;margin:0;padding:0 1.55rem 0 1.35rem;border:0;border-top:0;background:linear-gradient(90deg,#e8f7f8 0%,#eef7ff 44%,#eaf2ff 100%);backdrop-filter:blur(42px) saturate(190%);-webkit-backdrop-filter:blur(42px) saturate(190%);box-shadow:none;outline:0}
    .super-admin-brand{display:flex;align-items:center;gap:.8rem;justify-self:stretch;color:#2450f5;text-decoration:none;font-weight:950;font-size:1.55rem}
    .super-admin-brand-logo{display:block;height:3rem;width:auto;object-fit:contain}
    .super-admin-nav-icon{display:grid;width:1.15rem;height:1.15rem;place-items:center}
    .super-admin-nav-icon svg,.super-admin-rail a svg,.super-admin-userbar button svg{width:1.22rem;height:1.22rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .super-admin-nav{display:flex;justify-content:center;align-items:center;gap:.5rem;justify-self:center}
    .super-admin-nav a{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:2.85rem;padding:0 1rem;border-radius:.85rem;color:#17233d;text-decoration:none;font-weight:850;white-space:nowrap;transition:background .18s ease,color .18s ease,transform .18s ease,box-shadow .18s ease}
    .super-admin-nav a:hover{background:rgba(255,255,255,.42);color:#315cff;transform:translateY(-1px);box-shadow:0 12px 28px rgba(49,92,255,.08),inset 0 1px 0 rgba(255,255,255,.65)}
    .super-admin-nav a.is-active{background:rgba(255,255,255,.48);color:#315cff;box-shadow:0 12px 30px rgba(49,92,255,.10),inset 0 1px 0 rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.64);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .super-admin-userbar{display:flex;align-items:center;justify-content:flex-start;gap:.65rem;direction:ltr;justify-self:start;min-width:0}
    .super-admin-user{display:flex;align-items:center;gap:.7rem;direction:ltr;min-width:0;color:inherit;text-decoration:none}
    .super-admin-user>span:last-child{direction:rtl}
    .super-admin-avatar{position:relative;width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#d9e6ff,#8759e8);color:#fff;font-weight:950;box-shadow:0 10px 24px rgba(30,55,95,.12)}
    .super-admin-avatar img{width:100%;height:100%;object-fit:cover}
    .super-admin-avatar:after{content:"";position:absolute;right:.12rem;bottom:.12rem;width:.62rem;height:.62rem;border-radius:999px;background:#18c964;border:2px solid #fff}
    .super-admin-user strong{display:block;max-width:7.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem;font-weight:950}
    .super-admin-user small{display:block;margin-top:.1rem;color:#7a8597;font-size:.72rem;font-weight:800}
    .super-admin-userbar button{position:relative;display:grid;width:2.65rem;height:2.65rem;place-items:center;border:1px solid rgba(255,255,255,.66);border-radius:999px;background:rgba(255,255,255,.34);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);color:#1b2b4c;box-shadow:0 12px 26px rgba(30,55,95,.08),inset 0 1px 0 rgba(255,255,255,.72)}
    .super-admin-userbar button:last-child{margin-right:1.15rem}
    .super-admin-userbar .has-dot:after{content:"";position:absolute;top:.55rem;right:.65rem;width:.5rem;height:.5rem;border-radius:99px;background:#ef4444;border:1px solid #fff}
    .super-admin-rail{position:fixed;z-index:75;top:94px;right:1.3rem;width:72px;height:calc(100dvh - 112px);display:flex;flex-direction:column;align-items:center;gap:.55rem;padding:.6rem;border:1px solid rgba(255,255,255,.76);border-radius:1.35rem;background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.45));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 22px 55px rgba(30,55,95,.09),inset 0 1px 0 rgba(255,255,255,.88)}
    .super-admin-rail a{display:grid;width:2.85rem;height:2.85rem;place-items:center;border-radius:.95rem;color:#536386;text-decoration:none}
    .super-admin-rail a:hover,.super-admin-rail a.is-active{background:#eef4ff;color:#315cff;box-shadow:0 10px 22px rgba(49,92,255,.1)}
    .super-admin-rail a:last-child{margin-top:auto}
    .super-admin-nav-badge{display:inline-flex;min-width:1.15rem;height:1.15rem;padding:0 .3rem;align-items:center;justify-content:center;border-radius:999px;background:#ef4444;color:#fff;font-size:.68rem;font-weight:900;line-height:1}
    .super-admin-rail a{position:relative}
    .super-admin-rail a[data-badge]:after{content:attr(data-badge);position:absolute;top:.35rem;left:.35rem;min-width:1rem;height:1rem;padding:0 .25rem;display:flex;align-items:center;justify-content:center;border-radius:999px;background:#ef4444;color:#fff;font-size:.62rem;font-weight:900;line-height:1}
    body:has(.super-admin-chrome) .app-shell{display:block!important;height:100dvh!important;overflow:hidden!important;background:radial-gradient(circle at 84% 12%,rgba(49,92,255,.14),transparent 26%),radial-gradient(circle at 22% 4%,rgba(16,185,129,.10),transparent 24%),radial-gradient(circle at 50% 92%,rgba(139,92,246,.10),transparent 34%),linear-gradient(180deg,#f8fbff 0,#eef4fb 100%)!important}
    body:has(.super-admin-chrome) .profile-sidebar,body:has(.super-admin-chrome) .panel-topbar,body:has(.super-admin-chrome) .app-topbar{display:none!important}
    body:has(.super-admin-chrome) .app-main{display:block!important;height:calc(100dvh - 82px)!important;overflow:auto!important;padding:1rem 6.6rem 1.5rem 1.3rem!important;background:transparent!important}
    body:has(.super-admin-chrome):has(.user-profile-page--student) .app-main{padding-top:0!important}
    body:has(.super-admin-chrome) .app-content{width:100%!important;max-width:none!important;margin:0!important;padding:0!important}
    body:has(.super-admin-chrome) .super-admin-page{font-family:"B Yekan",BYekan,"B Yekan+",Vazirmatn,Tahoma,Arial,sans-serif!important;font-size:15px!important}
    body:has(.super-admin-chrome) .sys-overview{min-height:calc(100dvh - 82px)!important;height:calc(100dvh - 82px)!important;margin-top:0!important;background:transparent!important;overflow:auto!important}
    body:has(.super-admin-chrome) .sys-top,body:has(.super-admin-chrome) .sys-rail{display:none!important}
    body:has(.super-admin-chrome) .sys-shell{display:block!important;padding:1rem 6.6rem 1.5rem 1.3rem!important}
    body:has(.super-admin-chrome) .sys-main{height:auto!important;overflow:visible!important;padding:0!important}
    body:has(.super-admin-chrome) .profile-page{display:block!important;height:100dvh!important;min-height:100dvh!important;margin-top:0!important;overflow:hidden!important;background:radial-gradient(circle at 84% 12%,rgba(49,92,255,.14),transparent 26%),radial-gradient(circle at 22% 4%,rgba(16,185,129,.10),transparent 24%),radial-gradient(circle at 50% 92%,rgba(139,92,246,.10),transparent 34%),linear-gradient(180deg,#f8fbff 0,#eef4fb 100%)!important}
    body:has(.super-admin-chrome) .profile-main{display:block!important;height:calc(100dvh - 82px)!important;overflow:auto!important;padding:1rem 6.6rem 1.5rem 1.3rem!important;background:transparent!important}
    .settings-glass:has(.super-admin-chrome)>.settings-topbar,.settings-glass:has(.super-admin-chrome)>.settings-rail,body:has(.super-admin-chrome) .settings-glass>.settings-topbar,body:has(.super-admin-chrome) .settings-glass>.settings-rail{display:none!important}
    .settings-glass:has(.super-admin-chrome),body:has(.super-admin-chrome) .settings-glass{min-height:calc(100dvh - 82px);height:calc(100dvh - 82px);margin-top:0;padding:0;background:transparent!important;overflow:auto}
    .settings-glass:has(.super-admin-chrome) .settings-hero,body:has(.super-admin-chrome) .settings-glass .settings-hero{padding:1rem 6.6rem 0 1.3rem}
    .settings-glass:has(.super-admin-chrome) .settings-layout,body:has(.super-admin-chrome) .settings-glass .settings-layout{padding:1rem 6.6rem 1.5rem 1.3rem}
    body:has(.super-admin-workspace){height:100dvh!important;overflow:hidden!important;background:radial-gradient(circle at 84% 12%,rgba(49,92,255,.14),transparent 26%),radial-gradient(circle at 22% 4%,rgba(16,185,129,.10),transparent 24%),radial-gradient(circle at 50% 92%,rgba(139,92,246,.10),transparent 34%),linear-gradient(180deg,#f8fbff 0,#eef4fb 100%)!important}
    body:has(.super-admin-workspace)>.mx-auto{display:none!important}
    body:has(.super-admin-workspace) .super-admin-chrome{display:block!important;height:82px!important}
    body:has(.super-admin-workspace) .super-admin-workspace{width:100%!important;max-width:none!important;box-sizing:border-box!important;height:calc(100dvh - 82px)!important;min-height:calc(100dvh - 82px)!important;overflow-y:auto!important;overflow-x:hidden!important;margin:0!important;padding:1rem 6.6rem 1.5rem 1.3rem!important;background:transparent!important;scrollbar-width:none!important;-ms-overflow-style:none!important}
    body:has(.super-admin-workspace) .super-admin-workspace::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
    .super-admin-menu-toggle{position:absolute;left:-9999px}
    .super-admin-menu-btn{display:none;position:absolute;top:50%;right:1.3rem;transform:translateY(-50%);width:2.65rem;height:2.65rem;border:1px solid rgba(255,255,255,.66);border-radius:999px;background:rgba(255,255,255,.34);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);color:#1b2b4c;box-shadow:0 12px 26px rgba(30,55,95,.08),inset 0 1px 0 rgba(255,255,255,.72);cursor:pointer;place-items:center}
    .super-admin-menu-btn svg{width:1.3rem;height:1.3rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

        .super-admin-nav{display:none;position:absolute;top:100%;right:0;left:0;flex-direction:column;align-items:stretch;gap:.3rem;max-height:calc(100dvh - 90px);overflow-y:auto;padding:.75rem 1rem 1.25rem;background:#fdfeff;border-top:1px solid var(--line);box-shadow:0 30px 60px rgba(30,55,95,.16)}
        .super-admin-nav a{justify-content:flex-start;height:3rem}

    @media (max-width:760px){.super-admin-topbar{padding:0 1rem;grid-template-columns:1fr auto}.super-admin-userbar{display:none}.super-admin-rail{display:none}body:has(.super-admin-chrome) .app-main{height:auto!important;overflow:visible!important;padding:1rem!important}.settings-glass:has(.super-admin-chrome){overflow:auto}.settings-glass:has(.super-admin-chrome) .settings-hero,.settings-glass:has(.super-admin-chrome) .settings-layout{padding:1rem}body:has(.super-admin-workspace){height:auto!important;overflow:auto!important}body:has(.super-admin-workspace) .super-admin-workspace{height:auto!important;min-height:100dvh!important;overflow:visible!important;padding:1rem!important}}
</style>
