{% if item.media %}<span class="qx-item-media qx-item-media--{{ item.media_kind }}">{% if item.media_kind == 'image' %}<img src="{{ item.media }}" alt="" loading="lazy" data-zoomable title="بزرگ‌نمایی تصویر">{% elif item.media_kind == 'audio' %}<audio src="{{ item.media }}" controls preload="none"></audio>{% elif item.media_kind == 'video' %}<video src="{{ item.media }}" controls preload="metadata" playsinline></video>{% endif %}</span>{% endif %}
