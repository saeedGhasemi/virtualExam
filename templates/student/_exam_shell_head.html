{% load static core_extras %}
<style>
  .sx{--blue:#075fff;--ink:#07183b;--muted:#64748b;--line:#dbe6f4;direction:rtl;min-height:100vh;background:radial-gradient(circle at 91% 7%,rgba(66,111,255,.12),transparent 28%),radial-gradient(circle at 8% 8%,rgba(45,212,191,.08),transparent 22%),linear-gradient(180deg,#fbfdff,#eff5fc);color:var(--ink);font-family:"B Yekan",BYekan,Vazirmatn,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
  .sx *{box-sizing:border-box;letter-spacing:0}.sx a{text-decoration:none;color:inherit}.sx svg{width:1.22rem;height:1.22rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sx button,.sx input,.sx textarea,.sx select{font:inherit}
  .sx-title{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin:0 0 24px}.sx-title h1{margin:0;font-size:2rem;font-weight:950}.sx-title p{margin:.2rem 0 0;color:#61708d;font-weight:850}.sx-card{border:1px solid rgba(255,255,255,.72);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42));box-shadow:0 24px 58px rgba(30,55,95,.07),inset 0 1px 0 rgba(255,255,255,.88);backdrop-filter:blur(28px)}.sx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid #b7caff;border-radius:10px;background:rgba(255,255,255,.82);padding:0 22px;color:#075fff;font-weight:950}.sx-btn.primary{border-color:transparent;background:linear-gradient(135deg,#075fff,#1267ff);color:#fff;box-shadow:0 16px 32px rgba(7,95,255,.24)}.sx-btn.danger{border-color:#ff4d4d;color:#ef2929;background:#fff}.sx-chip{display:inline-flex;align-items:center;gap:8px;min-height:30px;border-radius:999px;padding:0 12px;background:#e8f0ff;color:#075fff;font-weight:950}.sx-chip.green,.sx-chip.done{background:#dcf8ea;color:#10a461}.sx-chip.orange,.sx-chip.upcoming{background:#fff1d6;color:#f59e0b}.sx-chip.gray{background:#eef2f7;color:#64748b}.sx-dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#18c964}.sx-dot.orange{background:#f59e0b}.sx-dot.gray{background:#8b96aa}.sx-dot.blue{background:#075fff}.sx-dot.red{background:#ef4444}
  .sx-field input,.sx-field textarea,.sx-field select,.sx-input{width:100%;border:1px solid #d8e4f2;border-radius:10px;background:rgba(255,255,255,.76);padding:12px 14px;color:#0d1b3f;outline:none;font-weight:850}.sx-field textarea{min-height:150px;resize:vertical}.sx-field label{display:block;margin-bottom:8px;color:#142858;font-weight:950}.sx-progress{height:8px;border-radius:999px;background:#dfe6f2;overflow:hidden}.sx-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#075fff,#4d83ff)}
  @media(max-width:760px){.sx{font-size:14px}.sx-title h1{font-size:1.45rem}}
</style>
