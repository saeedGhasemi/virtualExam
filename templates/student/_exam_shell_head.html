{% load static core_extras %}
<style>
  .sx{--blue:#075fff;--ink:#07183b;--muted:#64748b;--line:#dbe6f4;direction:rtl;min-height:100vh;background:radial-gradient(circle at 91% 7%,rgba(66,111,255,.12),transparent 28%),radial-gradient(circle at 8% 8%,rgba(45,212,191,.08),transparent 22%),linear-gradient(180deg,#fbfdff,#eff5fc);color:var(--ink);font-family:"B Yekan",BYekan,Vazirmatn,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.55}
  .sx *{box-sizing:border-box;letter-spacing:0}.sx a{text-decoration:none;color:inherit}.sx svg{width:1.22rem;height:1.22rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.sx button,.sx input,.sx textarea,.sx select{font:inherit}
  .sx-top{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;align-items:center;gap:18px;height:106px;padding:16px 36px 20px;border-bottom:1px solid rgba(211,222,238,.82);background:rgba(255,255,255,.66);backdrop-filter:blur(26px)}.sx-brand{display:flex;align-items:center;gap:12px;justify-self:start;color:#1267ff;font-size:1.6rem;font-weight:950}.sx-brand-full-logo{height:38px;width:auto}
  .sx-nav{display:flex;justify-content:center;gap:34px}.sx-nav a{display:inline-flex;align-items:center;gap:9px;min-height:56px;padding:0 18px;border-radius:16px;color:#102044;font-weight:950;white-space:nowrap}.sx-nav a.is-active{min-width:150px;justify-content:center;color:var(--blue);background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.92);box-shadow:0 14px 32px rgba(49,92,255,.11),inset 0 1px 0 #fff;border-bottom:3px solid var(--blue)}
  .sx-user{display:flex;align-items:center;gap:13px;direction:ltr;justify-self:start}.sx-user button{position:relative;display:grid;width:54px;height:54px;place-items:center;border:1px solid rgba(255,255,255,.85);border-radius:50%;background:rgba(255,255,255,.58);color:#13213b;box-shadow:0 14px 28px rgba(30,55,95,.08)}.sx-user .dot:after{content:"";position:absolute;top:12px;right:13px;width:8px;height:8px;border-radius:99px;background:#ef4444;border:1px solid #fff}.sx-profile{display:flex;align-items:center;gap:12px;direction:ltr}.sx-avatar{position:relative;display:grid;width:54px;height:54px;place-items:center;border-radius:50%;background:linear-gradient(145deg,#b8a0ff,#8b5cf6);color:#fff;font-weight:950}.sx-avatar:after{content:"";position:absolute;right:3px;bottom:3px;width:11px;height:11px;border:2px solid #fff;border-radius:50%;background:#18c964}.sx-profile span:last-child{direction:rtl}.sx-profile strong,.sx-profile small{display:block;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sx-profile small{color:#6f7d99;font-weight:850}
  .sx-shell{display:grid;grid-template-columns:76px minmax(0,1fr);gap:22px;padding:24px}.sx-rail{position:sticky;top:24px;height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;gap:18px;padding:17px 12px;border:1px solid rgba(255,255,255,.82);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.5));box-shadow:0 26px 58px rgba(30,55,95,.09)}.sx-rail a{display:grid;width:48px;height:48px;place-items:center;border-radius:16px;color:#56637d}.sx-rail a.is-active{color:#075fff;background:#eef4ff;box-shadow:0 12px 24px rgba(49,92,255,.12)}.sx-rail a:last-child{margin-top:auto;color:#ff2b2b}
  .sx-main{min-width:0}.sx-title{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin:0 0 24px}.sx-title h1{margin:0;font-size:2rem;font-weight:950}.sx-title p{margin:.2rem 0 0;color:#61708d;font-weight:850}.sx-card{border:1px solid rgba(255,255,255,.72);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.42));box-shadow:0 24px 58px rgba(30,55,95,.07),inset 0 1px 0 rgba(255,255,255,.88);backdrop-filter:blur(28px)}.sx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;border:1px solid #b7caff;border-radius:10px;background:rgba(255,255,255,.82);padding:0 22px;color:#075fff;font-weight:950}.sx-btn.primary{border-color:transparent;background:linear-gradient(135deg,#075fff,#1267ff);color:#fff;box-shadow:0 16px 32px rgba(7,95,255,.24)}.sx-btn.danger{border-color:#ff4d4d;color:#ef2929;background:#fff}.sx-chip{display:inline-flex;align-items:center;gap:8px;min-height:30px;border-radius:999px;padding:0 12px;background:#e8f0ff;color:#075fff;font-weight:950}.sx-chip.green,.sx-chip.done{background:#dcf8ea;color:#10a461}.sx-chip.orange,.sx-chip.upcoming{background:#fff1d6;color:#f59e0b}.sx-chip.gray{background:#eef2f7;color:#64748b}.sx-dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#18c964}.sx-dot.orange{background:#f59e0b}.sx-dot.gray{background:#8b96aa}.sx-dot.blue{background:#075fff}.sx-dot.red{background:#ef4444}
  .sx-field input,.sx-field textarea,.sx-field select,.sx-input{width:100%;border:1px solid #d8e4f2;border-radius:10px;background:rgba(255,255,255,.76);padding:12px 14px;color:#0d1b3f;outline:none;font-weight:850}.sx-field textarea{min-height:150px;resize:vertical}.sx-field label{display:block;margin-bottom:8px;color:#142858;font-weight:950}.sx-progress{height:8px;border-radius:999px;background:#dfe6f2;overflow:hidden}.sx-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#075fff,#4d83ff)}
  @media(max-width:1180px){.sx-top,.sx-shell{grid-template-columns:1fr}.sx-rail{display:none}.sx-nav{overflow:auto;justify-content:flex-start}.sx-user{justify-self:end}}@media(max-width:760px){.sx{font-size:14px}.sx-top{height:auto;padding:16px;gap:12px}.sx-nav{gap:8px}.sx-shell{padding:14px}.sx-title h1{font-size:1.45rem}}
</style>
